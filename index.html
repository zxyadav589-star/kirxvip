<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining VIP Channel...</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            margin: 0;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #151a23;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            box-sizing: border-box;
        }
        h2 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            background: linear-gradient(45deg, #00ff88, #00b359);
            color: #000000;
            text-decoration: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>

    <script>
        function openTelegram() {
            // Direct Web Link
            window.location.href = "https://t.me/+7LjmGQRUdig2MWY1";

        // Fast Auto-trigger on page load

</head>

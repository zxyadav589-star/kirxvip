<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP NUMBER PREDICTION | OFFICIAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(15, 5, 5, 0.8);
            border: 1px solid #ff3b00;
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 59, 0, 0.25), inset 0 0 15px rgba(255, 59, 0, 0.1);
        }

        .tag {
            display: inline-block;
            border: 1px solid #ff3b00;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #ff3b00;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #ff4500;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.6);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            border-top: 1px solid rgba(255, 59, 0, 0.2);
            border-bottom: 1px solid rgba(255, 59, 0, 0.2);
            padding: 15px 0;
        }

        .stat-item h3 {
            font-size: 22px;
            color: #ff5500;
        }

        .stat-item p {
            font-size: 10px;
            color: #aaaaaa;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(90deg, #ff3b00, #ff6a00);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 16px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255, 59, 0, 0.6);
            margin-bottom: 30px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 59, 0, 0.9);
        }

        .members-title {
            font-size: 11px;
            color: #ff4500;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .members-count {
            font-size: 36px;
            font-weight: bold;
            color: #ff5500;
            text-shadow: 0 0 12px rgba(255, 85, 0, 0.5);
            margin-bottom: 20px;
        }

        .footer-tags {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 10px;
            color: #888888;
            margin-bottom: 15px;
        }

        .sub-footer {
            font-size: 9px;
            color: #555555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">

            </div>
            <div class="stat-item">
                <h3>24/7</h3>
                <p>SUPPORT</p>
            </div>
            <div class="stat-item">

        <!-- Updated New Telegram Link -->

            ➤ JOIN ON TELEGRAM
        </a>

        <div class="members-title">◆ ACTIVE MEMBERS</div>
        <div class="members-count">7K+</div>

        <div class="footer-tags">
            <span>◆ 100% Free</span>
            <span>◆ New Content Daily</span>
        </div>

        <div class="sub-footer">VIP NUMBER PREDICTION • PREMIUM COMMUNITY</div>

</body>
</html>
